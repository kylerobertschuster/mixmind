    <path d="M100 140 C100 120, 300 120, 300 140 L300 155 L100 155 Z" fill="#f2c4ce" stroke="#080809" stroke-width="2.5"/>
    <path d="M100 140 C100 115, 300 115, 300 140" fill="none" stroke="#080809" stroke-width="2.5"/>
    <text x="200" y="215" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#080809" letter-spacing="2">JuicePipe</text>
    <text x="200" y="255" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#080809" opacity="0.5" letter-spacing="4">PREMIUM</text>
    <rect x="112" y="240" width="176" height="90" rx="8" fill="rgba(0,0,0,0.03)"/>
    <path d="M112 280 Q200 270 288 280" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
  </g>

  <g>
