<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="strawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="120" width="200" height="220" rx="16" ry="16" fill="url(#boxGrad)" stroke="#ddd" stroke-width="2"/>
    <path d="M100 140 C100 120, 300 120, 300 140 L300 155 L100 155 Z" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
    <path d="M100 140 C100 115, 300 115, 300 140" fill="none" stroke="#ddd" stroke-width="2"/>
  </g>

  <g>
    <rect x="270" y="30" width="16" height="120" rx="8" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <rect x="278" y="35" width="4" height="110" rx="2" fill="rgba(255,255,255,0.3)"/>
    <g filter="url(#shadow)">
      <path d="M270 145 Q282 155 288 150 L288 165 Q282 170 270 160 Z" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <path d="M268 150 Q282 162 290 155 L290 170 Q282 177 268 165 Z" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    </g>
    <rect x="256" y="165" width="16" height="100" rx="8" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" transform="rotate(-35, 264, 215)"/>
    <rect x="262" y="170" width="4" height="90" rx="2" fill="rgba(255,255,255,0.25)" transform="rotate(-35, 264, 215)"/>
    <ellipse cx="224" cy="250" rx="11" ry="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" transform="rotate(-35, 224, 250)"/>
  </g>

  <text x="200" y="215" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="900" letter-spacing="1">
    <tspan fill="#ff6b6b">J</tspan><tspan fill="#ffa94d">u</tspan><tspan fill="#ffd43b">i</tspan><tspan fill="#69db7c">c</tspan><tspan fill="#4dabf7">e</tspan><tspan fill="#748ffc">P</tspan><tspan fill="#da77f2">i</tspan><tspan fill="#f783ac">p</tspan><tspan fill="#ff6b6b">e</tspan>
  </text>

  <text x="200" y="255" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#bbb" letter-spacing="3">MIXMIND</text>

  <circle cx="282" cy="60" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="286" cy="80" r="1.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="280" cy="100" r="1" fill="rgba(255,255,255,0.4)"/>
</svg>
