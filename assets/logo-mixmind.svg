    <rect x="278" y="35" width="4" height="110" rx="2" fill="rgba(0,0,0,0.08)"/>
    <g filter="url(#shadow)">
      <path d="M270 145 Q282 155 288 150 L288 165 Q282 170 270 160 Z" fill="url(#bendGrad)" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"/>
      <path d="M268 150 Q282 162 290 155 L290 170 Q282 177 268 165 Z" fill="url(#bendGrad)" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
      <line x1="272" y1="152" x2="286" y2="157" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
      <line x1="270" y1="158" x2="288" y2="163" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    </g>
    <rect x="256" y="165" width="18" height="100" rx="9" fill="url(#strawGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" transform="rotate(-35, 265, 215)"/>
    <rect x="262" y="170" width="4" height="90" rx="2" fill="rgba(0,0,0,0.06)" transform="rotate(-35, 264, 215)"/>
    <ellipse cx="224" cy="250" rx="12" ry="4" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" transform="rotate(-35, 224, 250)"/>
  </g>

  <circle cx="282" cy="60" r="2" fill="rgba(0,0,0,0.15)"/>
  <circle cx="286" cy="80" r="1.5" fill="rgba(0,0,0,0.10)"/>
  <circle cx="280" cy="100" r="1" fill="rgba(0,0,0,0.12)"/>
  <path d="M140 335 C140 340, 142 345, 142 348" fill="none" stroke="#e8b0bc" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="142" cy="352" r="2" fill="#e8b0bc" opacity="0.3"/>
