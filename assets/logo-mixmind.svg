<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d5dd"/>
      <stop offset="50%" stop-color="#f2c4ce"/>
      <stop offset="100%" stop-color="#e8b0bc"/>
    </linearGradient>
    <linearGradient id="strawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="30%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.02)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)"/>
    </linearGradient>
    <linearGradient id="bendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.05)"/>
      <stop offset="40%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
