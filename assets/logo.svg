<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Lime green gradient for the juicebox -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B2FF59"/>
      <stop offset="50%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#64DD17"/>
    </linearGradient>
    <!-- Glass straw gradient (transparent with highlights) -->
    <linearGradient id="strawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <!-- Glass bendy section -->
    <linearGradient id="bendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Juicebox body -->
  <g filter="url(#shadow)">
    <!-- Main box -->
    <rect x="100" y="120" width="200" height="220" rx="16" ry="16" fill="url(#boxGrad)" stroke="#558B2F" stroke-width="3"/>
    
    <!-- Top flap (slightly open) -->
    <path d="M100 140 C100 120, 300 120, 300 140 L300 155 L100 155 Z" fill="#76FF03" stroke="#558B2F" stroke-width="2.5"/>
    <path d="M100 140 C100 115, 300 115, 300 140" fill="none" stroke="#558B2F" stroke-width="2.5"/>
    
    <!-- JuicePipe text on box -->
    <text x="200" y="215" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#1B5E20" letter-spacing="2">JuicePipe</text>
    
    <!-- Small flavor text -->
    <text x="200" y="255" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#558B2F" letter-spacing="4">PREMIUM</text>
    
    <!-- Juice level line visible through box (subtle) -->
    <rect x="112" y="240" width="176" height="90" rx="8" fill="rgba(255,255,255,0.08)"/>
    <path d="M112 280 Q200 270 288 280" fill="none" stroke="rgba(255,255,0,0.15)" stroke-width="2"/>
  </g>

  <!-- Glass bendy straw -->
  <g>
    <!-- Straight part (going into box) -->
    <rect x="270" y="30" width="18" height="120" rx="9" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    
    <!-- Glass highlight streak on straight part -->
    <rect x="278" y="35" width="4" height="110" rx="2" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Bendy accordion section -->
    <g filter="url(#shadow)">
      <path d="M270 145 Q282 155 288 150 L288 165 Q282 170 270 160 Z" fill="url(#bendGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M268 150 Q282 162 290 155 L290 170 Q282 177 268 165 Z" fill="url(#bendGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <!-- Short horizontal glass lines at bend -->
      <line x1="272" y1="152" x2="286" y2="157" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="270" y1="158" x2="288" y2="163" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </g>
    
    <!-- Angled piece going to mouth -->
    <rect x="256" y="165" width="18" height="100" rx="9" fill="url(#strawGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" transform="rotate(-35, 265, 215)"/>
    
    <!-- Glass highlight on angled piece -->
    <rect x="262" y="170" width="4" height="90" rx="2" fill="rgba(255,255,255,0.2)" transform="rotate(-35, 264, 215)"/>
    
    <!-- Straw opening (mouthpiece) — glass rim -->
    <ellipse cx="224" cy="250" rx="12" ry="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(-35, 224, 250)"/>
  </g>

  <!-- Small decorative sparkles on the glass -->
  <circle cx="282" cy="60" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="286" cy="80" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="280" cy="100" r="1" fill="rgba(255,255,255,0.5)"/>
  
  <!-- Small drips (sealed box, fresh) -->
  <path d="M140 335 C140 340, 142 345, 142 348" fill="none" stroke="#64DD17" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="142" cy="352" r="2" fill="#64DD17" opacity="0.3"/>
</svg>
