# fly.toml — JuicePipe Proxy deployment config for Fly.io
# Generated by: fly launch
# Deploy with: ~/.fly/bin/fly deploy

app = "mixmind-proxy"
primary_region = "ewr"

[build]
  builder = "heroku/buildpacks:20"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[env]
  NODE_ENV = "production"

[metrics]
  port = 9100
  path = "/healthz"
