<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixMind by JuicePipe</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ccc;
            --muted: #666;
            --accent: #a78bfa;
            --border: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 24px 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: #fff;
        }

        .flavor {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 60px;
        }

        .action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 80px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.15s;
        }

        .download-btn:hover {
            background: #e0e0e0;
        }

        .version {
            font-size: 12px;
            color: var(--muted);
        }

        .nav {
            display: flex;
            gap: 32px;
            margin-bottom: 60px;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s;
        }

        .nav a:hover {
            color: var(--text);
        }

        .coming-soon {
            margin-top: 40px;
            padding: 24px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        .coming-soon h3 {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .soon-items {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .soon-item {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        footer {
            margin-top: auto;
            font-size: 12px;
            color: var(--muted);
            padding-top: 60px;
        }

        @media (max-width: 500px) {
            body { padding: 60px 16px 40px; }
            .logo { font-size: 32px; }
            .nav { gap: 20px; }
        }
    </style>
</head>
<body>
    <div class="logo">JuicePipe</div>
    <div class="flavor">MixMind &mdash; AI mixing assistant</div>

    <div class="action">
        <a href="/downloads/MixMind-1.1.0.pkg" class="download-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download
        </a>
        <div class="version">macOS 12+ &middot; VST3 &amp; AU &middot; Version 1.1.0</div>
    </div>

    <nav class="nav">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Purchase</a>
    </nav>

    <div class="coming-soon">
        <h3>Coming soon</h3>
        <div class="soon-items">
            <div class="soon-item">MasterMind</div>
            <div class="soon-item">StemSplitter</div>
            <div class="soon-item">JuiceRack</div>
        </div>
    </div>

    <footer>JuicePipe &copy; 2026</footer>
</body>
</html>
